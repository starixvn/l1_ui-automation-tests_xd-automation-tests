variables:
  GIT_CLEAN_FLAGS: none

stages:
  - test
  - report

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm

smoketestxd:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-$GAMEID
  stage: test
  tags:
    - auto-test-prod
  script:
    - cd /app/tests
    - npm run test:smoke:xd --env=$ENV --gameid=$GAMEID --project=$STACK_NAME
    - cp -r .. $CI_PROJECT_DIR
  after_script:
    - sleep 5
    - |
      if [ -f "test-results/Warning.txt" ]; then
        echo "Warning.txt found"
        export Warning=true
      else
        echo "Warning.txt not found"
        export Warning=false
      fi
    - echo $Warning
  retry: 1
  rules:
    - if: $TRIGGER == "true" && $MODE == "SMOKEXD"
      when: always
    - when: never

  artifacts:
    paths:
      - playwright-report
      - screenshots
      - test-results
      - allure-results
    when: always
    expire_in: 1 day                                         # and set the variable produced in script to `environment:url`

report:
  stage: report
  script:
    - chmod +x upload_results.sh
    - ./upload_results.sh