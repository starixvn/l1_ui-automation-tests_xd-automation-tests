variables:
  GIT_CLEAN_FLAGS: none

stages:
  - build
  - test

docker-build:
  image: hub.lumigame.com/base/docker:20.10.7
  tags:
    - docker
  stage: build

  before_script:
    - export CI_REGISTRY_IMAGE=$DOCKER_REG_LOCAL_URL/pentagon-base/automation-tests-game-$GAMEID
    - docker login -u $DOCKER_REG_LOCAL_USERNAME -p $DOCKER_REG_LOCAL_PASSWORD $DOCKER_REG_LOCAL_URL
  script:
    - docker build --build-arg gameId=$GAMEID --pull -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - when: never

include: "**/.gitlab-ci.yml"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm

smoketestxd:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-$GAMEID
  stage: test
  tags:
    - auto-test-prod
  script:
    - curl -sSf http://10.70.70.120:8080 || exit 1
    - cd /app/tests
    - npm run test:smoke:xd --env=$ENV --gameid=$GAMEID --project=$STACK_NAME
    - apt-get update && apt-get install -y zip curl  # Install necessary tools
    - cd /app/
# Zip and upload Allure results
    - apt-get update && apt-get install -y zip curl # Install necessary tools
    - zip -r allure-results.zip allure-results  # Zip the results (no need to change directory before this)
    - curl -X POST 'http://10.70.70.120:8080/api/report/test' -F 'allureReportArchive=@allure-results.zip;type=application/x-zip-compressed'
    - cd $CI_PROJECT_DIR/app/tests 
    - ls # Check contents of directory 
    - cp -r .. $CI_PROJECT_DIR

  retry: 0
  rules:
    - if: $TRIGGER == "true" && $MODE == "SMOKEXD"
      when: always
    - when: never

  artifacts:
    paths:
      - allure-results
    when: always
    expire_in: 1 day                                         # and set the variable produced in script to `environment:url`
