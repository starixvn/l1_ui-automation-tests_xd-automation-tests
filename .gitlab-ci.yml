variables:
  GIT_CLEAN_FLAGS: none

stages:
  - build
  - test

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm

docker-build:
  image: hub.lumigame.com/base/docker:20.10.7
  tags:
    - docker
  stage: build

  before_script:
    - export CI_REGISTRY_IMAGE=$DOCKER_REG_LOCAL_URL/pentagon-base/automation-tests-game-$GAMEID
    - docker login -u $DOCKER_REG_LOCAL_USERNAME -p $DOCKER_REG_LOCAL_PASSWORD $DOCKER_REG_LOCAL_URL
  script:
    - docker build --build-arg gameId=$GAMEID --pull -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - when: never

include: "**/.gitlab-ci.yml"

smoketestxd:
  image: hub.lumigame.com/pentagon-base/automation-tests-game-$GAMEID
  stage: test
  tags:
    - auto-test-prod
  script:
    - cd /app/tests
    - npm run test:smoke:xd --env=$ENV --gameid=$GAMEID --project=$STACK_NAME> $STACK_NAME.txt 2>&1
    - cp -r .. $CI_PROJECT_DIR
  after_script:
    - sleep 5
    - cat $STACK_NAME.txt | grep -i "TrueWarning" && export WARNING=true || export WARNING=false
    - echo $WARNING
  retry: 1
  rules:
    - if: $TRIGGER == "true" && $MODE == "SMOKEXD"
      when: always
    - when: never

  artifacts:
    paths:
      - playwright-report
      - screenshots
      - test-results
 
    when: always
    expire_in: 1 day                                         # and set the variable produced in script to `environment:url`